# The sysroots that hosts.toml names. Each digest is the one of the file
# at its first download.

# musl 1.2.6 from the Alpine Linux 3.24 package musl-dev, the C library
# that the runtime archive of antic carries for Linux. The tools link it
# statically. The kernel headers of the package linux-headers 7.0.0 go
# beside it, since libc++ and LLVM include linux/futex.h and others.
[musl-x86_64]
url = "https://dl-cdn.alpinelinux.org/alpine/v3.24/main/x86_64/musl-dev-1.2.6-r2.apk"
sha256 = "6831e8b9e4821dae2c9121f0641f81e543f4ac27c03144c4876980ee84e6988f"
headers-url = "https://dl-cdn.alpinelinux.org/alpine/v3.24/main/x86_64/linux-headers-7.0.0-r1.apk"
headers-sha256 = "c4535f3f0dc6fd4d80efa7ff2a7a72a2d3f8dae31e2587c0785cc3243889cdf2"

[musl-aarch64]
url = "https://dl-cdn.alpinelinux.org/alpine/v3.24/main/aarch64/musl-dev-1.2.6-r2.apk"
sha256 = "ca72b84f4eb3c36bbbec04d919eb10159d414c7a43413cc2253841d301fa9486"
headers-url = "https://dl-cdn.alpinelinux.org/alpine/v3.24/main/aarch64/linux-headers-7.0.0-r1.apk"
headers-sha256 = "d61656e81116040ebac0bc8d9046a3ba97f01a00ee085809103576e8a437468f"

# glibc 2.35 of Ubuntu 22.04 and its kernel headers, the sysroot of the
# sanitizer runtimes of Linux. Ubuntu 22.04 is the oldest LTS in support,
# so a runtime built against it runs on every newer glibc. The packages
# come from the release pocket of jammy, whose files never change.
[glibc-x86_64]
libc-dev-url = "https://archive.ubuntu.com/ubuntu/pool/main/g/glibc/libc6-dev_2.35-0ubuntu3_amd64.deb"
libc-dev-sha256 = "cc37cab5c60bcfe4bbf289a8002f369949a41ed46e8b51a0503a001099370c56"
