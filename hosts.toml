# The hosts that antic runs on, named as its targets. A table gives the
# triple of the host and the machine that builds it. It also gives the kind
# of sysroot from pins/sysroot.toml and the CMake options of the host.
# build-llvm.cmake and scripts/common.sh read the tables.

# The twelve tools that every tools archive holds. antic writes LLVM IR
# text and runs opt and llc on it. llvm-profdata merges the profiles of a
# program that -fprofile-generate instruments, which opt reads. llvm-cov
# reports the coverage of antic's own tests from such a profile. antic
# measures its tests with it and does not ship it. antic links a release
# program once with -g and ships it with the debug information stripped:
# llvm-objcopy and llvm-strip strip it, and dsymutil writes the dSYM of a
# macOS program.
tools = ["lld", "llvm-mc", "opt", "llc", "llvm-ar", "llvm-objdump", "llvm-readobj", "llvm-profdata", "llvm-cov", "llvm-objcopy", "llvm-strip", "dsymutil"]

# The compiler that every clang archive holds, beside its built-in headers
# and the compiler-rt builtins of all six targets.
compiler = ["clang"]

[linux-x86_64]
triple = "x86_64-unknown-linux-musl"
built-on = "macos-arm64"
sysroot = "musl"
# clang is linked against musl and compiles for glibc by default, the C
# library of the distributions that build antic. --target picks musl.
flags = ["-DLLVM_DEFAULT_TARGET_TRIPLE=x86_64-unknown-linux-gnu"]

[linux-arm64]
triple = "aarch64-unknown-linux-musl"
built-on = "macos-arm64"
sysroot = "musl"
flags = ["-DLLVM_DEFAULT_TARGET_TRIPLE=aarch64-unknown-linux-gnu"]

[macos-arm64]
triple = "arm64-apple-darwin"
built-on = "macos-arm64"
sysroot = "macos-sdk"
# The oldest macOS the binaries start on. Each one records it as minos.
deployment-target = "11.0"
flags = ["-DCMAKE_OSX_ARCHITECTURES=arm64"]

[macos-x86_64]
triple = "x86_64-apple-darwin"
built-on = "macos-arm64"
sysroot = "macos-sdk"
deployment-target = "11.0"
flags = ["-DCMAKE_OSX_ARCHITECTURES=x86_64"]

[windows-x86_64]
triple = "x86_64-pc-windows-msvc"
built-on = "macos-arm64"
sysroot = "xwin"
flags = ["-DHOST_ARCH=x86_64"]

[windows-arm64]
triple = "aarch64-pc-windows-msvc"
built-on = "macos-arm64"
sysroot = "xwin"
flags = ["-DHOST_ARCH=aarch64"]
